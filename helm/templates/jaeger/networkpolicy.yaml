{{- if .Values.jaegerAllInOne.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-to-jaeger
  labels:
    {{- include "holepunch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- end }}
