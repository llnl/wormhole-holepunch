http_address = "0.0.0.0:4180"
provider = "oidc"
skip_provider_button = true

# Must be reachable from inside the oauth2-proxy container
oidc_issuer_url = "http://dex.holepunch.localwormhole:5556"

client_id = "oauth2-proxy"
client_secret = "oauth2-proxy-secret"
# oauth2-proxy sits behind Envoy on the auth domain, every endpoint beneath the reserved
# /-/wormhole/oauth2 prefix (see docs/oauth-manager.md).
proxy_prefix = "/-/wormhole/oauth2"
reverse_proxy = true
redirect_url = "http://auth.holepunch.localwormhole:3128/-/wormhole/oauth2/callback"

# Use Redis for session storage instead of cookie sessions. Must match Holepunch's
# HOLEPUNCH_OAUTH_PROXY_SESSION_STORE (holepunch.env).
session_store_type = "redis"
redis_connection_url = "redis://redis:6379/0"

# Plain HTTP for the PoC only.
cookie_secure = false
cookie_samesite = "lax"
cookie_expire = "12h"
# Host-only on the auth domain, the oauthmngr plugin hands the session across to each
# sub-domain as its own cookie.
cookie_name = "_oauth2_proxy"
cookie_secret = "BU1fnzmxhZdfwc5CjrqlqkxfFZdGXjfH5qhpsCF4mMw="

# The flow only ever redirects (rd) to the auth domain's oauthmngr callback, the port must
# be explicit for local testing.
whitelist_domains = ["auth.holepunch.localwormhole:3128"]

# who can login (required configuration)
email_domains = [ "*" ]

# request scopes (Dex supports these)
scope = "openid email profile"

# include the OIDC access_token in the session and return it on /oauth2/auth
pass_access_token = true
set_authorization_header = true
set_xauthrequest = true

# Make oauth2-proxy act like an auth service (no upstream needed)
upstreams = ["static://200"]
