{{- if .Values.jaegerAllInOne.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "holepunch.serviceAccountName" . }}-jaeger
  labels:
    {{- include "holepunch.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
