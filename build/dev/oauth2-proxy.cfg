http_address = "0.0.0.0:4180"
provider = "oidc"
skip_provider_button = true

# Must be reachable from inside the oauth2-proxy container
oidc_issuer_url = "http://dex.holepunch.localwormhole:5556"

client_id = "oauth2-proxy"
client_secret = "oauth2-proxy-secret"
redirect_url = "http://oauth.holepunch.localwormhole:4180/oauth2/callback"

# Use Redis for session storage instead of cookie sessions
session_store_type = "redis"
redis_connection_url = "redis://redis:6379/0"

# Plain HTTP for the PoC only.
cookie_secure = false
cookie_samesite = "lax"
cookie_expire = "12h"
cookie_name = "_wormhole_holepunch_test"
# Leave the cookie domain more permissive until all necessary Holepunch changes in place to
# limit the cookie scope to a single domain is fully supported.
cookie_domains = [".holepunch.localwormhole"]
cookie_secret = "BU1fnzmxhZdfwc5CjrqlqkxfFZdGXjfH5qhpsCF4mMw="

# allow redirect back to any subdomain, for local testing we need to explicitly
# call out the envoy host since oauth2 seems to have issues with the wildcard
# when a specific port is involved.
whitelist_domains = [".holepunch.localwormhole", "envoy.holepunch.localwormhole:3128"]

# who can login (required configuration)
email_domains = [ "*" ]

# request scopes (Dex supports these)
scope = "openid email profile"

# include the OIDC access_token in the session and return it on /oauth2/auth
pass_access_token = true
set_authorization_header = true
set_xauthrequest = true

# Make oauth2-proxy act like an auth service (no upstream needed)
upstreams = ["static://200"]
