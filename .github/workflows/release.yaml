name: Release Actions

# In order to limit the usage of a limited number of GitHub Actions minutes, we only run the release workflow
# on Github, the full test suite will be limited to GitLab for the time being.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 2
    permissions:
      contents: read
      packages: write

    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract Go version from spack.yaml
        id: go-version
        run: |
          GO_VERSION=$(grep -oP 'go@\K[0-9.]+' spack.yaml | head -1)
          echo "version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      # https://github.com/docker/login-action/releases/tag/v4.6.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/metadata-action/releases/tag/v6.2.0
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # https://github.com/docker/build-push-action/releases/tag/v7.3.0
      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: build/image/Containerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
